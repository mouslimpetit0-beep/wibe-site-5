<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سيرين – تصميم وبرمجة المتاجر الإلكترونية</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#030c18;--ink:#e6f9ff;--mute:#8fb4c4;--gold:#38d9ff;--line:rgba(150,225,255,.2);--serif:"Amiri","Times New Roman",serif;--sans:"Tajawal","Segoe UI",Arial,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#030c18;--ink:#e6f9ff}}
:root[data-theme="dark"]{--bg:#030c18;--ink:#e6f9ff}
html{scroll-behavior:smooth;scroll-padding-top:90px}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.8 var(--sans);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60vmax 50vmax at 20% 0,#0c5f86 0,transparent 60%),radial-gradient(50vmax 45vmax at 95% 45%,#0a2a5e 0,transparent 62%),radial-gradient(60vmax 50vmax at 30% 100%,#0a4a6e 0,transparent 60%),var(--bg)}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;line-height:1.35}
a{color:inherit;text-decoration:none}button,input,select,textarea{font-family:inherit}
:focus-visible,.btn:focus-within{outline:2px solid var(--gold);outline-offset:3px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.wrap{width:min(1180px,92%);margin:0 auto}
section{padding:clamp(60px,9vw,120px) 0}
.glass{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.04) 45%,rgba(255,255,255,.09));backdrop-filter:blur(22px) saturate(1.8);-webkit-backdrop-filter:blur(22px) saturate(1.8);border:1px solid var(--line);border-radius:26px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 0 24px rgba(255,255,255,.05),0 30px 60px -22px rgba(0,0,0,.55)}
.glass::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(240px circle at var(--mx,70%) var(--my,0%),rgba(255,255,255,.18),transparent 60%)}
.btn{display:inline-block;border:0;cursor:pointer;font:700 15px/1 var(--sans);padding:16px 28px;border-radius:999px;color:#021018;background:linear-gradient(180deg,#8ff0ff,var(--gold) 55%,#1aa9d6);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 10px 28px -8px rgba(56,217,255,.55);transition:transform .25s}
.btn:hover{transform:translateY(-2px)}.btn.sm{padding:11px 20px;font-size:14px}
.btn.line{background:rgba(255,255,255,.08);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:14px 0}
nav{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 26px 9px 10px;border-radius:999px}
.logo{font:700 26px var(--serif)}.logo i{color:var(--gold);font-style:normal}
nav ul{display:flex;gap:28px;list-style:none;padding:0;font-size:15px;color:var(--mute)}nav ul a:hover{color:var(--ink)}
.hero{padding-top:clamp(30px,6vw,80px)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:44px;align-items:center}
.hero h1{font-size:clamp(40px,6vw,82px);line-height:1.25}
.hero p{max-width:30em;color:var(--mute);margin:24px 0 34px;font-size:19px}
.act{display:flex;gap:14px;flex-wrap:wrap}
.heroimg{aspect-ratio:1;border-radius:50%;overflow:hidden;animation:fl 9s ease-in-out infinite;box-shadow:0 0 70px rgba(56,217,255,.35),inset 0 0 0 1px rgba(56,217,255,.45)}.lmk{width:40px;height:40px;border-radius:50%;vertical-align:middle;margin-left:10px;box-shadow:0 0 14px rgba(56,217,255,.55)}
.heroimg img,.ph img{width:100%;height:100%;object-fit:cover;display:block}
.htag{position:absolute;z-index:2;inset:auto 16px 16px;padding:12px 18px;border-radius:18px;background:rgba(7,32,31,.55);backdrop-filter:blur(14px);border:1px solid var(--line);font-size:14.5px}
@keyframes fl{50%{transform:translateY(-12px)}}
.head{margin-bottom:48px;max-width:34em}.head h2{font-size:clamp(32px,4.4vw,58px)}.head p{color:var(--mute);margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.cat{padding:14px 14px 26px}.ph{aspect-ratio:5/6;border-radius:18px;overflow:hidden;margin-bottom:18px;background:rgba(0,0,0,.2)}
.cat h3,.cat p{padding:0 10px}.cat h3{font-size:24px}.cat p{color:var(--mute);font-size:15px;margin-top:6px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.plan{padding:34px 28px;display:flex;flex-direction:column}
.plan.top{background:linear-gradient(135deg,rgba(56,217,255,.28),rgba(255,255,255,.06) 55%,rgba(14,111,148,.25))}
.plan h3{font-size:28px}.price{font:700 44px var(--serif);color:var(--gold);margin:8px 0 18px}.price small{font:400 15px var(--sans);color:var(--mute)}
.plan ul{list-style:none;padding:0;flex:1;margin-bottom:24px;color:var(--mute);font-size:15.5px}
.plan li{padding:8px 0;border-top:1px solid var(--line)}.plan li::before{content:"\2713";color:var(--gold);margin-left:10px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));counter-reset:s}
.step{padding:10px 26px;border-right:1px solid var(--line);counter-increment:s}.step:first-child{border:0}
.step::before{content:counter(s);font:700 46px var(--serif);color:var(--gold)}
.step h3{font-size:22px}.step p{color:var(--mute);font-size:15px}
.vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:30px;padding:clamp(30px,5vw,56px)}
.vals h3{color:var(--gold);font-size:23px}.vals p{color:var(--mute);font-size:15px}
.order{padding:clamp(30px,6vw,70px);border-radius:40px;background:linear-gradient(135deg,rgba(56,217,255,.2),rgba(255,255,255,.05) 50%,rgba(14,111,148,.22))}
.order h2{font-size:clamp(32px,4.6vw,60px);margin-bottom:10px}.order>p{color:var(--mute);max-width:34em;margin-bottom:30px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fg .full,.dg .full{grid-column:1/-1}
label.f{display:block;font-size:14px;color:var(--mute)}
.in{width:100%;margin-top:6px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);font-size:16px}
.in:focus{outline:none;border-color:var(--gold)}select.in option{color:#111}
.msg{margin-top:14px;min-height:26px;color:var(--gold)}
footer{padding:36px 0 56px;color:var(--mute);font-size:14px}footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:26px}
@media(max-width:860px){nav ul{display:none}.hero .wrap{grid-template-columns:1fr}.heroimg{max-width:420px;margin:0 auto;width:100%}.fg{grid-template-columns:1fr}.step{border:0;border-top:1px solid var(--line)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#admin{display:none;min-height:100vh}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .glass{padding:40px;width:min(420px,100%)}
.login h2{font-size:32px;margin-bottom:6px}.login p{color:var(--mute);font-size:14px;margin-bottom:18px}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{padding:22px 16px;border-left:1px solid var(--line);background:rgba(0,0,0,.28);backdrop-filter:blur(18px);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;overflow:auto}
.side .logo{padding:6px 12px 22px}
.side button{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:none;border:0;color:var(--mute);font:500 16px var(--sans);padding:13px 16px;border-radius:14px;cursor:pointer}
.side button:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.side button.on{background:linear-gradient(135deg,rgba(56,217,255,.25),rgba(255,255,255,.06));color:var(--ink);box-shadow:inset 0 0 0 1px rgba(56,217,255,.4)}
.side .sp{flex:1}.badge{margin-right:auto;background:var(--gold);color:#021018;font:700 12px var(--sans);padding:2px 9px;border-radius:99px}
.main{padding:clamp(18px,3vw,40px);min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:26px;flex-wrap:wrap}.top h2{font-size:34px}.top p{color:var(--mute);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.stat{padding:22px}.stat span{color:var(--mute);font-size:14px}.stat b{display:block;font:700 36px var(--serif);margin-top:4px}.stat em{font-style:normal;font-size:13px;color:var(--gold)}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:20px}
.pan{padding:24px}.pan h3{font-size:22px;margin-bottom:16px}
.bars{display:grid;gap:14px}.bar{display:grid;grid-template-columns:130px 1fr 30px;gap:12px;align-items:center;font-size:14px}
.bar i{display:block;height:10px;border-radius:9px;background:linear-gradient(270deg,var(--gold),#0e6f94)}.bar div{background:rgba(255,255,255,.08);border-radius:9px}
.donut{display:flex;align-items:center;gap:22px;flex-wrap:wrap}.ring{width:140px;height:140px;border-radius:50%;position:relative}.ring::after{content:"";position:absolute;inset:26px;border-radius:50%;background:#061a2b}
.lg{display:grid;gap:8px;font-size:14px}.lg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-left:8px}
.bar2{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}.bar2 .in{margin:0;flex:1 1 240px;max-width:340px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--mute);padding:9px 16px;border-radius:99px;cursor:pointer;font:500 14px var(--sans)}
.chip.on{background:var(--gold);color:#021018;border-color:var(--gold)}.chip b{margin-right:6px;opacity:.7}
.tw{overflow-x:auto;border-radius:22px}table{width:100%;border-collapse:collapse;min-width:820px}
th{text-align:right;font:500 13px var(--sans);color:var(--mute);padding:16px 18px;background:rgba(0,0,0,.25);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:15px 18px;border-bottom:1px solid rgba(150,225,255,.08);font-size:15px;white-space:nowrap}
tbody tr{cursor:pointer;transition:background .2s}tbody tr:hover{background:rgba(255,255,255,.07)}tbody tr:last-child td{border:0}
.cu{display:flex;align-items:center;gap:12px}.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 16px var(--serif);color:#021018;background:linear-gradient(135deg,#8ff0ff,#1aa9d6)}
.cu small{display:block;color:var(--mute);font-size:12.5px;direction:ltr;text-align:right}.oid{color:var(--gold);font-weight:700;direction:ltr;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;font:500 13px var(--sans);background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.empty{padding:50px;text-align:center;color:var(--mute)}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(460px,100%);z-index:50;background:rgba(4,16,30,.94);backdrop-filter:blur(26px);border-right:1px solid var(--line);padding:26px;overflow:auto;transform:translateX(-105%);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
#drawer.open{transform:none}#shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none}#shade.on{display:block}
.dh{display:flex;justify-content:space-between;align-items:start;margin-bottom:20px}.dh h3{font-size:28px}
.x{background:rgba(255,255,255,.08);border:0;color:var(--ink);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:16px}
.stp{display:flex;margin:6px 0 22px}.stp button{flex:1;border:0;background:none;color:var(--mute);font:500 12px var(--sans);cursor:pointer;padding:0 2px}
.stp button::before{content:"";display:block;height:6px;border-radius:6px;background:rgba(255,255,255,.12);margin:0 2px 8px}
.stp button.on::before{background:var(--c)}.stp button.on{color:var(--c)}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.drow{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.dng{background:rgba(255,120,120,.14);color:#ff9a9a;box-shadow:inset 0 0 0 1px rgba(255,120,120,.4)}
.ed{padding:22px;margin-bottom:16px}.ed h3{font-size:22px;margin-bottom:14px;color:var(--gold)}.ed .dg{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.tag{display:inline-block;margin-top:10px;font-size:13px;color:var(--mute)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.slot{padding:14px}.slot .ph{margin-bottom:12px}.slot h4{font-size:17px;margin-bottom:12px}.slot .drow{margin:0}
.crow{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:start}.crow .ph{margin:0}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,30px);opacity:0;pointer-events:none;background:var(--gold);color:#021018;padding:12px 22px;border-radius:99px;font-weight:700;z-index:99;transition:.3s}#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;overflow-x:auto;border:0;padding:10px}.side .logo,.side .sp{display:none}.side button{white-space:nowrap;width:auto}.two{grid-template-columns:1fr}.crow{grid-template-columns:1fr}.crow .ph{max-width:200px}}
#fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:22px;z-index:30;display:flex;flex-direction:column;gap:12px}#fab button{width:56px;height:56px;border-radius:50%;border:1px solid rgba(56,217,255,.5);cursor:pointer;color:#021018;background:linear-gradient(180deg,#8ff0ff,var(--gold) 55%,#1aa9d6);display:grid;place-items:center;box-shadow:0 10px 28px -8px rgba(56,217,255,.7);transition:transform .25s}#fab button:hover{transform:scale(1.08)}.mgw{width:min(1180px,92%);margin:40px auto 0}.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.mg figure{overflow:hidden;margin:0}.mg img,.mg video{width:100%;display:block;aspect-ratio:16/10;object-fit:cover;background:#000}.mg figcaption{padding:12px 16px;font-size:14px;color:var(--mute)}#modal{position:fixed;inset:0;z-index:80;display:none;place-items:center;padding:16px}#modal.on{display:grid}.mb{position:absolute;inset:0;background:rgba(0,0,0,.6)}.md{z-index:1;width:min(560px,100%);max-height:90vh;overflow:auto;padding:28px;background:rgba(4,16,30,.96)}.md h4{font-size:18px;margin-top:22px}.ml{display:grid;gap:10px;margin-top:10px}.mi{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:14px;font-size:14px}.mt{width:72px;height:54px;border-radius:10px;overflow:hidden;background:#000}.mt img,.mt video{width:100%;height:100%;object-fit:cover}
#contact{display:none}.cpage{padding-top:clamp(40px,7vw,90px)}.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}.cc{padding:34px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}.bic{width:96px;height:96px;border-radius:24px;box-shadow:0 0 30px rgba(56,217,255,.3),0 14px 30px -10px rgba(0,0,0,.6)}.cc h3{font-size:26px}.soon{color:var(--mute);font-size:14px;padding:16px 0}
#orderp{display:none}a.cat{display:block}.cat{cursor:pointer;transition:transform .3s}.cat:hover{transform:translateY(-6px)}.cat .go{display:block;padding:14px 10px 0;color:var(--gold);font-weight:700;font-size:15px}.ohead{display:flex;gap:18px;align-items:center;margin-bottom:26px;padding-bottom:22px;border-bottom:1px solid var(--line)}.ohead h3{font-size:26px}.ohead p{color:var(--mute);font-size:15px;margin:0}.ordok{text-align:center;padding:20px 0}.ordok h3{font-size:32px;color:var(--gold);margin-bottom:10px}.ordok p{color:var(--mute);margin:0 auto 24px;max-width:30em}.ordok .btn{margin:6px}
</style>
</head>

<div id="site"></div><div id="contact"></div><div id="orderp"></div><div id="admin"></div><div id="shade"></div><aside id="drawer" aria-label="تفاصيل الطلب"></aside><div id="toast" role="status"></div><div id="modal"></div>
